name: NOVA safe compile fix

on:
  push:
    branches:
      - feature/nova-agent-core-v1

permissions:
  contents: write

jobs:
  patch-ime-action:
    if: ${{ !contains(github.event.head_commit.message, 'fix(agent): use AccessibilityAction for IME enter') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/nova-agent-core-v1

      - name: Apply exact one-line fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/GestureAccessibilityService.java')
          s = p.read_text()
          old = 'focused.performAction(AccessibilityNodeInfo.ACTION_IME_ENTER)'
          new = 'focused.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId())'
          if old not in s:
              raise SystemExit('Expected old IME action reference was not found; refusing to modify the file.')
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one old IME action reference; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify exact change
        run: |
          grep -F 'AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId()' app/src/main/java/GestureAccessibilityService.java
          if grep -F 'AccessibilityNodeInfo.ACTION_IME_ENTER' app/src/main/java/GestureAccessibilityService.java; then
            echo 'Old reference still present; refusing to commit.'
            exit 1
          fi

      - name: Commit exact fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/GestureAccessibilityService.java
          git rm .github/workflows/nova-safe-fix.yml
          git commit -m 'fix(agent): use AccessibilityAction for IME enter'
          git push origin HEAD:feature/nova-agent-core-v1
