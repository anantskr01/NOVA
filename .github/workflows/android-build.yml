name: NOVA Android Build

on:
  push:
    branches:
      - main
      - nova-v1-foundation-2026-09-14
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build PC companion
        run: ./gradlew --no-daemon :pc-companion:build
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:clean :app:assembleDebug
