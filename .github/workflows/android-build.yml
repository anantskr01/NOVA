name: NOVA Android + PC Build

on:
  push:
    branches:
      - main
      - nova-v1-foundation-2026-09-14
      - feature/**
      - phase-2-universal-tools
      - consolidate/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build PC companion when present
        shell: bash
        run: |
          if [ -d pc-companion ]; then
            ./gradlew :pc-companion:build --no-daemon
          else
            echo 'No pc-companion module on this branch; skipping.'
          fi

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
