name: NOVA CI

on:
  push:
    branches:
      - nova-v1-foundation-2026-09-14
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build PC companion
        run: ./gradlew :pc-companion:build
      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug
