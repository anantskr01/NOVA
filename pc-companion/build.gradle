plugins {
    id 'application'
}

group = 'com.aircontrol'
version = '1.0.0'

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.aircontrol.pc.Main'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}
