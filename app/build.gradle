def geminiProperties = new Properties()
def geminiPropertiesFile = rootProject.file("gemini.properties")
if (geminiPropertiesFile.exists()) {
    geminiPropertiesFile.withInputStream { stream ->
        geminiProperties.load(stream)
    }
}

def geminiApiKey = geminiProperties.getProperty("GEMINI_API_KEY", "").trim()
def escapedGeminiApiKey = geminiApiKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aircontrol'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.aircontrol'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0'
        buildConfigField "String", "GEMINI_API_KEY", "\"${escapedGeminiApiKey}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
